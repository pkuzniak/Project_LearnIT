global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: ec2-node
    static_configs:
      - targets:
          - 16.171.113.22:9100
        labels:
          instance_name: learnit-ec2
          environment: production

  - job_name: app-health
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets:
          - http://16.171.113.22:8000/health
        labels:
          environment: production
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
