name: Build and publish

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./app
          push: true
          tags: ghcr.io/pkuzniak/project_learnit:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/pkuzniak/Project_LearnIT
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-north-1
      AWS_PAGER: ""
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_VERSION: ${{ github.sha }}

    steps:
      - name: Deploy image through Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/pkuzniak/project_learnit:${APP_VERSION}"

          PARAMETERS=$(jq -n \
            --arg image "$IMAGE" \
            --arg version "$APP_VERSION" \
            '{
              commands: [
                "set -eu",
                ("docker pull " + $image),
                "docker rm -f learnit-app",
                ("docker run -d --name learnit-app --restart unless-stopped -p 8000:8000 -e APP_VERSION=" + $version + " " + $image),
                "curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/health"
              ],
              executionTimeout: ["300"]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMETERS" \
            --comment "Deploy LearnIT ${APP_VERSION}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json



#Autmoanion notifications on builds:


  notify:
    name: Send email notification
    needs: [build, deploy]
    if: ${{ always() && vars.MAIL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    permissions: {}

    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: example321@example.com
      BUILD_RESULT: ${{ needs.build.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      BRANCH: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Send pipeline result through SMTP
        shell: python
        run: |
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          required = [
              "SMTP_HOST", "SMTP_PORT", "SMTP_USERNAME",
              "SMTP_PASSWORD", "MAIL_FROM", "MAIL_TO"
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing configuration: " + ", ".join(missing))

          message = EmailMessage()
          message["Subject"] = (
              f"LearnIT: build={os.environ['BUILD_RESULT']}, "
              f"deploy={os.environ['DEPLOY_RESULT']}"
          )
          message["From"] = os.environ["MAIL_FROM"]
          message["To"] = os.environ["MAIL_TO"]
          message.set_content(
              f"Branch: {os.environ['BRANCH']}\n"
              f"Commit: {os.environ['COMMIT']}\n"
              f"Build: {os.environ['BUILD_RESULT']}\n"
              f"Deployment: {os.environ['DEPLOY_RESULT']}\n"
              f"Details: {os.environ['RUN_URL']}\n"
          )

          host = os.environ["SMTP_HOST"]
          port = int(os.environ["SMTP_PORT"])
          context = ssl.create_default_context()

          if port == 465:
              server = smtplib.SMTP_SSL(
                  host, port, timeout=30, context=context
              )
          else:
              server = smtplib.SMTP(host, port, timeout=30)
              server.starttls(context=context)

          with server:
              server.login(
                  os.environ["SMTP_USERNAME"],
                  os.environ["SMTP_PASSWORD"]
              )
              server.send_message(message)

          print("Email notification sent.")
